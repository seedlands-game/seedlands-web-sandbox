<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/styles/start-screen.css" />
    <title>Seedlands · Voxel Sandbox</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <main id="ui">
      <section id="start-card" class="panel" data-ui-fallback aria-label="Seedlands 启动界面">
        <p class="eyebrow">PROCEDURAL FANTASY WORLD</p>
        <h1>Seedlands</h1>
        <p>走进一个由 Seed 苏醒、会随脚步延展的体素秘境。</p>
        <div class="world-tags" aria-hidden="true">
          <span>草原</span><span>森林</span><span>山脉</span><span>河湖</span>
        </div>
        <div class="start-fields">
          <label>世界 Seed <input id="seed" maxlength="48" placeholder="需要 JavaScript 才能进入世界" /></label>
          <label
            >视觉质量
            <select id="quality">
              <option value="low">Low · 省电</option>
              <option value="medium" selected>Medium · 均衡</option>
              <option value="high">High · 远景</option>
            </select></label
          >
        </div>
        <button id="enter" disabled aria-disabled="true">进入世界</button>
        <small>同一 Seed + 生成器版本会得到同一基础世界</small>
        <section id="hud" hidden aria-hidden="true"></section>
      </section>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
