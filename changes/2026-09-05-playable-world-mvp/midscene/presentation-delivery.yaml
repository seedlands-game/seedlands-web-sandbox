web:
  url: http://127.0.0.1:4247/presentation.html
  viewportWidth: 1440
  viewportHeight: 1800
tasks:
  - name: Low夜间与窄屏减少动态原始帧
    flow:
      - aiAssert: 上方Low午夜画面中能辨认灯笼暖色表面、近处地形和木柱、准星与HUD，画面没有全黑或错误材质；光源附近有局部照明。
      - aiAssert: 下方设置截图中的四个音量标签、滑杆、百分比、画质与本地参考曲入口清晰，面板没有横向越出画面或装饰遮挡文字，返回按钮可见。
      - aiAssert: 下方操作指南截图中采集合成建造、WASD与空格等说明层级清楚，文字没有明显重叠截断，返回入口可见；两面板沿用相同深石与黄铜风格。
