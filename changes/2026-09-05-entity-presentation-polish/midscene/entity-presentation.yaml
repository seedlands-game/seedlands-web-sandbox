web:
  url: http://127.0.0.1:4241/?harness=1
  viewportWidth: 1280
  viewportHeight: 720
tasks:
  - name: 林地实体形体、色彩和入口可读
    flow:
      - aiInput: mosslight
        locate: 世界 Seed 输入框
      - aiTap: 进入世界
      - aiWaitFor: 游戏显示林地与底部快捷栏。
      - aiAssert: 中央营地附近可见有四条腿、头部和耳角的林鹿，以及穿深青蓝色衣服的直立居民；动物和人形可以从轮廓与色彩区分，不是相同的单色球。
      - aiAssert: 右上角地图、暂停按钮和附近实体标签各占清楚的位置，没有彼此遮挡；底部快捷栏与右下手套不遮住生命和饥饿读数。
      - aiAssert: 树冠表面有不规则、连续的叶片轮廓与空隙，能透出天空；不是整片不透明方块，也没有规则的粗大棋盘格孔洞。
      - aiTap: 暂停
      - aiTap: 保存并返回主菜单
      - aiAssert: 主菜单清楚显示继续世界、新世界 Seed 和设置入口，右上角已没有“温顺林鹿”“夜行兽”“营地居民”“浆果掉落物”这些附近实体标签。继续世界按钮上的 mosslight 是存档名称，应该保留。
