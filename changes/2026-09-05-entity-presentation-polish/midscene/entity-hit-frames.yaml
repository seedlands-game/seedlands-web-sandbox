tasks:
  - name: 原始浏览器受击帧的可见语义
    flow:
      - aiAssert: 页面并排展示命中前、命中后瞬间、400毫秒后三幅真实游戏画面；三图对应同一个近处的尖顶生物，画面和标签没有截断到无法识别。
      - aiAssert: 命中前生物主体是紫色，命中后瞬间主体明确闪为红橙色，400毫秒后恢复紫色与黄铜尖顶；这不是整幅截图变红，地面、天空和HUD保持各自正常颜色。
      - aiAssert: 命中后可见挥击手部或攻击命中的文字反馈，恢复图中生物仍存在，反馈能够表达一次未致死的真实攻击。
