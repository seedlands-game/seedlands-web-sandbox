model_list:
  - model_name: flash
    litellm_params:
      model: openai/mock-flash-backend
      api_base: os.environ/MOCK_PROVIDER_BASE_URL
      api_key: fake-provider-key
      max_parallel_requests: 2
  - model_name: pro
    litellm_params:
      model: openai/mock-pro-backend
      api_base: os.environ/MOCK_PROVIDER_BASE_URL
      api_key: fake-provider-key
      max_parallel_requests: 2

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2

litellm_settings:
  request_timeout: 2
  turn_off_message_logging: true
  telemetry: false

general_settings:
  master_key: sk-local-admission-only
  global_max_parallel_requests: 2
  disable_spend_logs: true
