# 先执行所属 change 的 Playwright 生成原始截图，再将原始 PNG 展示于本地取证页。
web:
  url: http://127.0.0.1:4282/
  viewportWidth: 1920
  viewportHeight: 1600

tasks:
  - name: 自然河岸转头倒影几何对应
    flow:
      - aiAssert: >-
          页面上两排自然河道截图分别为白天和黄昏，每排是同一位置转头的三个方向。
          对比同一排的河口方向、岸线台阶和树冠倒影：倒影随岸树发生一致的透视位置变化，
          倒置树冠与其上方对应岸树保持关联，不能出现倒影沿屏幕反方向旋转或整体贴在屏幕不动。
          不要求像素级锐利：反射有低分辨率模糊和水纹，但没有错向的大片镜像侧墙。
      - aiAssert: >-
          最后一排的三张固定洋红色球体截图中，水上的球与水面的洋红色倒影保持镜像对应；
          转头或向下看后倒影仍出现在球体的下方对应水面，不能横向漂到相反一侧或消失。
