web:
  url: http://127.0.0.1:4249/presentation.html
  viewportWidth: 1440
  viewportHeight: 1500

tasks:
  - name: 对比真实输入的裂纹早期、中期与转头帧
    flow:
      - aiAssert: >-
          页面展示同一次真实按住挖掘取得的三张标注画面。对比“早期阶段”和“中期阶段”：中期裂纹保留早期已经出现的主分支方向和中心，并沿原路径加长、增加细节；不能出现整张裂纹旋转、翻面或跳到石块另一处。画面中的金色细框是目标选择轮廓，不是裂纹悬浮框；底部八个并排方格是快捷栏，不是采集进度条。
      - aiAssert: >-
          对比“中期阶段”和“中期后轻微向右转头”：裂纹仍围绕同一石块表面中心，仅随石块产生正常透视位移，没有相对石材纹理自行旋转或滑动。三张图的裂纹线条均清晰，无旋转拖影；HUD没有新增独立采集进度条。
