# 本change真实浏览器旅程生成未经修饰的时间序列截图，本地取证页只排列原始帧。
web:
  url: http://127.0.0.1:4288/
  viewportWidth: 1920
  viewportHeight: 1600

tasks:
  - name: 河岸跳跃与低顶的连续轨迹
    flow:
      - aiAssert: >-
          页面“自然河岸与一格岸”组是同一场景按时间排列的真实帧。前进但未跳跃时没有自动升上一格岸；
          起跳后画面经历可辨的上升、中间高度和落地，岸线与相机的关系连续，不能直接从低处闪到岸顶。
          “低顶”组中头顶实体阻止上升，角色没有出现在屋顶或障碍物内部。
      - aiAssert: >-
          这些画面仍有完整三维手与工具、清楚的方块表面和不重叠的奇幻风格快捷栏、生命饥饿状态。
          调试信息没有代替游戏主体，也没有出现整片丢失网格或破裂的水面墙。

  - name: 水中介质与不同实体的连续运动
    flow:
      - aiAssert: >-
          页面“介质与实体”组显示角色从岸边进入浅水、半身入水、眼睛没入水面再浮出的连续状态。
          眼睛入水后的色调和远景可见度有明确而协调的变化，出水后恢复；边界没有把整帧反复黑屏或闪白。
          生物和掉落物都是风格一致的真实三维模型，运动过程中没有悬停于已挖空的支撑或突然跳到一格高处。

  - name: 碰撞调试线框与来源图例
    flow:
      - aiAssert: >-
          页面“碰撞调试”组开启时可以辨认角色、生物、掉落物的身体线框，以及灯笼在单格内的真实碰撞边界；
          灯笼不是用占满整格的方框冒充自身形状。权威与本地预测使用不同颜色且有清楚图例和tick信息，
          传感器明确表现为球形范围并与身体线框区分，接触细节可选。
      - aiAssert: >-
          页面“碰撞调试”组关闭后的帧中线框完全消失，游戏HUD和世界正常可见；
          水面倒影里没有复制的调试线框，阴影中也没有调试形状。开关面板内容清楚且没有遮挡其控件。
