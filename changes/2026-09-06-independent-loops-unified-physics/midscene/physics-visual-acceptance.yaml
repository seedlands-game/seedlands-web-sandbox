# 本change真实浏览器旅程生成未经修饰的时间序列截图，本地取证页只排列原始帧。
web:
  url: http://127.0.0.1:4288/
  viewportWidth: 1920
  viewportHeight: 1600

tasks:
  - name: 河岸跳跃与低顶的连续轨迹
    flow:
      - aiAssert: >-
          页面“自然河岸与一格岸”组是同一场景按时间排列的真实帧。
          画面先处于水内岸侧，之后经过可辨的上升、中间高度和岸上状态；岸线与相机的关系连续。
          不能只在两张首尾图中从低处直接闪到岸顶，中间帧应显示越过岸边的过程。
      - aiTap: 低顶净空
      - aiAssert: >-
          “低顶净空”组是高空构造的低顶夹具，周围天空不是地形丢失。
          按时间排列的帧中，石质顶面始终位于视点上方并阻止向上通过，角色没有出现在屋顶或障碍物内部。

  - name: 水中介质与不同实体的连续运动
    flow:
      - aiTap: 介质与实体
      - aiAssert: >-
          比较页面中同次旅程的岸边、涉水、潜水和出水取证帧：
          潜水帧的色调和远景可见度与岸边、出水帧有明确区别，出水帧恢复水上色调；展示的帧没有黑屏或全白。
          生物和掉落物是风格一致的三维模型。
      - aiTap: 实体下落序列
      - aiAssert: >-
          页面按照时间顺序展示同一固定视角的原始视频帧。
          生物和小方块掉落物起先位于高处，后续帧经过中间高度并在较低的地面上停下；
          可从岸边台阶与实体的相对位置看出下降，不是所有帧都悬停在同一个高度。
      - aiAssert: >-
          自然场景画面有三维手臂、清楚的方块表面和不重叠的奇幻风格快捷栏、生命与饥饿状态。
          调试信息没有代替游戏主体，自然河道没有整片丢失网格或破裂的水面墙。

  - name: 碰撞调试线框与来源图例
    flow:
      - aiTap: 碰撞调试
      - aiAssert: >-
          开启帧可辨认生物和掉落物的身体线框、俯视自己身体的预测线框，以及灯笼单格内更窄的真实碰撞边界；
          灯笼不能仅用占满整格的方框冒充实际形状。
          权威橙与预测青使用不同颜色且有图例和tick信息；拾取和吸附传感器为球形线框，与身体方框区分。
      - aiAssert: >-
          关闭后的帧中碰撞调试线框完全消失，普通方块选择轮廓可以保留，HUD和世界仍正常可见。
          面板控件清楚，没有互相重叠遮挡。
