web:
  url: http://127.0.0.1:4303/medium.html
  viewportWidth: 1800
  viewportHeight: 1600

tasks:
  - name: 检查 Medium 同次真实输入的太阳阴影连续原帧
    flow:
      - aiAssert: 页面按阶段和时间顺序展示冻结、正常昼夜、真实转头和移除遮挡物的游戏原始截图，草地、树干和阴影清楚可辨。
      - aiAssert: 冻结时间的同机位三帧里，地面阴影稳定，没有大块亮暗交替或消失重现。
      - aiAssert: 正常昼夜和真实转头序列里，阴影仍属于地面和树木，没有突然整体翻转、明显闪跳或跟随视角漂移；树干阴影边界和树叶镂空可辨，没有被过度模糊。
      - aiAssert: 移除受控遮挡物后，原来的树影区域变亮，实时阴影确实响应几何变化。
  - name: 检查 High 同次真实输入的太阳阴影连续原帧
    flow:
      - aiTap: 页面右上角的 High 链接
      - aiAssert: 页面标题为 high，冻结时间的同机位三帧里地面阴影稳定，没有大块亮暗交替或消失重现。
      - aiAssert: 正常昼夜和真实转头序列里，阴影仍属于地面和树木，没有突然整体翻转、明显闪跳或跟随视角漂移；树干阴影边界和树叶镂空可辨，没有被过度模糊。
      - aiAssert: 移除受控遮挡物后，原来的树影区域变亮，实时阴影确实响应几何变化。
