web:
  url: http://127.0.0.1:4310/drop-presentation.html
  viewportWidth: 1440
  viewportHeight: 1200

tasks:
  - name: 同次真实采集掉落的连续表现
    flow:
      - aiAssert: >-
          页面展示同一次真实 Pointer Lock 持续采集视频提取的早期、中期、接近地面和落地原始帧，
          每张图有阶段标签且能够看见同一个泥土方块掉落物与固定地面参照。
      - aiAssert: >-
          掉落物在前三个阶段沿连续向下的路径接近地面，尺寸、材质和旋转保持为同一个三维物件；
          没有长时间停在同一高度后突然跳动，也没有复制成多个物件或穿过地面。
      - aiAssert: >-
          最终帧中的掉落物自然停在地面上，既不明显悬浮也不嵌入方块；世界、手持物和HUD仍正常显示，
          没有因平滑表现新增残影或破坏原画质。
