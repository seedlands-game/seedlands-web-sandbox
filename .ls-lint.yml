ls:
  src:
    .dir: kebab-case
    .ts: kebab-case
    .svelte: kebab-case
  tests:
    .dir: kebab-case
    .test.ts: kebab-case
    .spec.ts: kebab-case
  scripts:
    .dir: kebab-case
    .mjs: kebab-case
  changes/*:
    .dir: regex:\d{4}-\d{2}-\d{2}-[a-z0-9]+(-[a-z0-9]+)*
    .md: kebab-case
  changes/2026-09-07-agent-routing-contracts:
    .dir: kebab-case
    .md: kebab-case
  changes/2026-09-07-agent-routing-contracts/skill/agent-work-routing:
    .md: regex:(SKILL|[a-z0-9]+(-[a-z0-9]+)*)
  changes/*/experiments:
    .dir: kebab-case
    .rs: kebab-case
    .sh: kebab-case
  changes/*/evidence:
    .dir: kebab-case
  changes/*/midscene:
    .dir: kebab-case
  changes/*/e2e:
    .dir: kebab-case
    .spec.ts: kebab-case

  crates:
    .dir: kebab-case
    .rs: kebab-case
ignore:
  - .git
  - .husky
  - .pnpm-store
  - coverage
  - dist
  - harness/results
  - midscene_run
  - node_modules
  - crates/target
