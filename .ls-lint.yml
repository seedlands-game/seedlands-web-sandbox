ls:
  src:
    .dir: kebab-case
    .ts: kebab-case
    .svelte: kebab-case
  apps:
    .dir: kebab-case
  apps/*:
    .dir: kebab-case
    .json: kebab-case
    .ts: kebab-case
  apps/*/src:
    .dir: kebab-case
    .ts: kebab-case
    .svelte: kebab-case
  packages:
    .dir: kebab-case
  packages/*:
    .dir: kebab-case
    .json: kebab-case
    .ts: kebab-case
  packages/*/src:
    .dir: kebab-case
    .ts: kebab-case
  tests:
    .dir: kebab-case
    .test.ts: kebab-case
    .spec.ts: kebab-case
  scripts:
    .dir: kebab-case
    .mjs: kebab-case
    .ts: kebab-case
  changes/*:
    .dir: regex:\d{4}-\d{2}-\d{2}-[a-z0-9]+(-[a-z0-9]+)*
    .md: kebab-case
  changes/2026-09-07-agent-routing-contracts:
    .dir: kebab-case
    .md: kebab-case
  changes/2026-09-07-agent-routing-contracts/skill/agent-work-routing:
    .md: regex:(SKILL|[a-z0-9]+(-[a-z0-9]+)*)
  changes/*/experiments:
    .dir: kebab-case
    .rs: kebab-case
    .sh: kebab-case
  changes/*/evidence:
    .dir: kebab-case
  changes/2026-09-08-gameplay-foundation:
    .dir: kebab-case
    .md: kebab-case
  changes/2026-09-08-node-monorepo/contracts:
    .dir: kebab-case
    .json: kebab-case
  changes/2026-09-08-web-node-playable/contracts:
    .dir: kebab-case
    .json: kebab-case
  changes/2026-09-09-browser-living-world-baseline/contracts:
    .dir: kebab-case
    .json: kebab-case
  changes/*/midscene:
    .dir: kebab-case
  changes/*/e2e:
    .dir: kebab-case
    .spec.ts: kebab-case

  crates:
    .dir: kebab-case
    .rs: kebab-case
ignore:
  - .git
  - .husky
  - .pnpm-store
  - coverage
  - dist
  - apps/*/dist
  - harness/results
  - midscene_run
  - node_modules
  - apps/*/node_modules
  - apps/web/node_modules
  - packages/game-core/node_modules
  - crates/target
